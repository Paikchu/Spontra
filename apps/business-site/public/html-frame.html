<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Picture</title>
<style>html,body{margin:0;padding:0;background:transparent}</style>
<script>
/*
 * The html picture frame. The page loads it with sandbox="allow-scripts" (no allow-same-origin), so it runs at
 * an opaque origin under its own CSP: inline scripts and pinned CDN scripts run, nothing reaches the network or
 * the page. The first html:render writes a document of the page's tokens, the agent's fragment and this same
 * script, which says when it has drawn and takes theme changes in place. The host sizes the frame; the fragment
 * fills it. A document is written once: the
 * window's globals outlive document.open, so a second fragment would collide with the first; a new picture gets
 * a new frame.
 */
(function boot(rendered) {
  // A copy of PICTURE_BASE_CSS in shared/analysis-runtime/lens/picture.ts, which the harness measures with.
  var BASE = "html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}body{display:flex;flex-direction:column;color:var(--foreground);font-family:var(--sans,system-ui,sans-serif);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}svg{display:block;max-width:100%;overflow:visible}";
  var current = null;
  function post(message) { window.parent.postMessage(message, "*"); }
  function vars(theme) {
    return ":root{" + Object.keys(theme.tokens).map(function (k) { return k + ":" + theme.tokens[k]; }).join(";") + ";color-scheme:" + theme.scheme + "}";
  }
  function css(font) {
    return (font ? '@font-face{font-family:"Geist";src:url("' + font + '") format("woff2");font-weight:100 900;font-display:swap}' : "")
      + BASE;
  }
  function render(m) {
    var doc = "<!doctype html><html lang=\"" + String(m.lang).replace(/[^a-zA-Z-]/g, "") + "\" class=\"" + m.theme.scheme + "\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><style id=\"tokens\">"
      + vars(m.theme) + "</style><style>" + css(m.font) + "</style><script>(" + boot.toString() + ")(" + JSON.stringify(m.id) + ")<\/script></head><body>" + m.html + "</body></html>";
    document.open(); document.write(doc); document.close();
  }
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent || !event.data) return;
    // A host that attached its listener after the first announcement asks again; a drawn picture stays quiet.
    if (event.data.type === "html:ping" && !rendered) post({ type: "html:ready" });
    if (event.data.type === "html:render" && !rendered) render(event.data);
    if (event.data.type === "html:theme" && rendered) {
      var style = document.getElementById("tokens");
      if (style) style.textContent = vars(event.data.theme);
      document.documentElement.className = event.data.theme.scheme;
    }
  });
  if (!rendered) { post({ type: "html:ready" }); return; }
  current = rendered;
  addEventListener("load", function () { post({ type: "html:rendered", id: current }); });
})(null);
</script></head><body></body></html>
