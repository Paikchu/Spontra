[package]
name = "spontra-desktop"
version = "0.1.3"
description = "Spontra desktop app"
edition = "2024"
rust-version = "1.90"

[lib]
name = "spontra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "sync", "time", "io-util"] }
url = "2"

[features]
# A test build runs a script inside the real webview and reports over IPC. Never part of a release.
selftest = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
