name: Desktop installers
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "packages/**", "app/**", "components/**", "lib/**", "shared/**", "public/**", "package*.json", "scripts/check-desktop-boundary.mjs", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run desktop:check
      - run: npx tsx --tsconfig tsconfig.test.json --test tests/desktop.test.ts tests/holding-plan.test.ts tests/holding-plan-store.test.ts tests/portfolio-view-model.test.ts tests/request-security.test.ts
      - run: npm run desktop:build && npm run desktop:boundary
      - run: npx playwright install --with-deps chromium
      - run: npm run desktop:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-evidence
          path: outputs/desktop-tests
          retention-days: 7
  installers:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run desktop:build && npm run desktop:boundary
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = @{}
          if ($env:WINDOWS_CERTIFICATE) {
            $certPath = Join-Path $env:RUNNER_TEMP 'spontra-signing.pfx'
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
            Remove-Item $certPath
            'SIGNING_LABEL=signed' >> $env:GITHUB_ENV
          } else { 'SIGNING_LABEL=unsigned-test' >> $env:GITHUB_ENV }
          $config | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/ci-signing.json
      - name: Configure macOS signing label
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo 'SIGNING_LABEL=signed' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_LABEL=unsigned-test' >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ runner.os == 'Windows' && '--config src-tauri/ci-signing.json' || '' }}
      - name: Install, launch, upgrade and uninstall Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'SpontraInstallCheck'
          $install = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Get-ChildItem $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'Installed executable missing' }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'Native window did not open' }
          $title = $app.MainWindowTitle
          Stop-Process -Id $app.Id
          $upgrade = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Reinstall failed' }
          $uninstaller = Get-ChildItem $installDir -Filter '*uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $uninstall = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          @{ installer = 'passed'; nativeWindow = $title; reinstall = 'passed'; uninstall = 'passed'; interactionFlows = 'not tested on Windows' } | ConvertTo-Json | Set-Content apps/desktop/windows-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: Spontra-${{ matrix.target }}-${{ env.SIGNING_LABEL }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/windows-smoke.json
          if-no-files-found: error
          retention-days: 14
